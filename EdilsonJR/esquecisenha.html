<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Senha - Torneio de Sinuca</title>

    <!-- Font Awesome - Ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- Reutiliza o CSS do Login para manter o mesmo estilo no celular e PC -->
    <link rel="stylesheet" href="login.css">
</head>

<body>

    <div class="login-container">

        <div class="login-box">

            <h1>Recuperar Senha</h1>

            <p style="text-align: center; font-size: 13px; margin-bottom: 20px; color: rgba(255, 255, 255, 0.8);">
                Digite o seu CPF ou E-mail cadastrado para redefinir sua senha.
            </p>

            <form id="form-esqueci-senha">

                <!-- CPF OU EMAIL -->
                <div class="input-box">
                    <input type="text" id="recuperar-usuario" placeholder="CPF ou E-mail" required>
                    <i class="fa-solid fa-envelope"></i>
                </div>

                <!-- BOTÃO -->
                <button type="submit" class="login-button">
                    Enviar Instruções
                </button>

            </form>

            <!-- VOLTAR AO LOGIN -->
            <p class="register">
                Lembrou a senha?
                <a href="login.html">Voltar ao Login</a>
            </p>

        </div>

    </div>

    <!-- SCRIPT DE RECUPERAÇÃO -->
    <script>
        document.getElementById("form-esqueci-senha").addEventListener("submit", function(event) {
            event.preventDefault();
            const usuario = document.getElementById("recuperar-usuario").value.trim();

            if (usuario !== "") {
                alert("Se os dados estiverem corretos em nosso sistema, você receberá as instruções de redefinição.");
                window.location.href = "login.html";
            }
        });
    </script>

</body>

</html>
