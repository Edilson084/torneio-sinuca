<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chaveamento - Torneio de Sinuca</title>
    <!-- Font Awesome - Ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="classificacao.css">
</head>
<body style="position: relative; min-height: 100vh; margin: 0; padding-top: 20px;">

    <!-- Botão de Regras -->
    <a href="informacoes.html" class="btn-regras"
        style="background: #222; color: #fff; padding: 10px 20px; border-radius: 20px; text-decoration: none; border: 1px solid #444; margin-left: 20px;">
        Regras / Como jogar
    </a>

    <!-- Botão Flutuante de Gerenciar Jogadores (Exclusivo para Admin no canto superior direito) -->
    <button id="btn-gerenciar" style="
        display: none;
        position: absolute;
        top: 20px;
        right: 30px;
        background: linear-gradient(135deg, #f39c12, #d35400);
        color: #fff;
        border: none;
        padding: 10px 20px;
        font-size: 14px;
        font-weight: bold;
        border-radius: 30px;
        cursor: pointer;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        transition: all 0.3s ease;
        z-index: 1000;
    " onmouseover="this.style.transform='translateY(-2px)'; this.style.boxShadow='0 6px 20px rgba(0,0,0,0.4)';" 
      onmouseout="this.style.transform='translateY(0)'; this.style.boxShadow='0 4px 15px rgba(0,0,0,0.3)';"
      onclick="window.location.href='gerenciar.html'">
        <i class="fa-solid fa-users-gear" style="margin-right: 6px;"></i> Gerenciar Jogadores
    </button>

    <div class="container" style="margin-top: 20px;">
        
        <h1>Chaveamento do Torneio</h1>
        <p class="subtitle">Acompanhe a evolução do campeonato em tempo real</p>

        <div class="controls">
            <p>Total de Jogadores Inscritos: <span id="total-jogadores">0</span></p>
            <button id="btn-sortear">Gerar / Resetar Chaveamento</button>
        </div>

        <!-- O JS insere as colunas das fases aqui dentro lado a lado -->
        <div class="bracket"></div>

    </div>

    <script src="classificacao.js"></script>
    <script>
        window.addEventListener('DOMContentLoaded', (event) => {
            const perfil = localStorage.getItem("usuario_perfil");
            
            // Se for admin, exibe o botão flutuante de gerenciar jogadores
            if (perfil === "admin") {
                const btnGerenciar = document.getElementById("btn-gerenciar");
                if (btnGerenciar) {
                    btnGerenciar.style.display = "block";
                }
            } else {
                // Se NÃO for admin, oculta os botões restritos
                const botoesAdmin = document.querySelectorAll('.btn-admin-gerenciar, .btn-resetar, .btn-avancar-fase'); 
                botoesAdmin.forEach(botao => {
                    botao.style.display = 'none';
                });
            }
        });
    </script>
</body>
</html>
