<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Torneio de Sinuca</title>

    <!-- Font Awesome - Ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="login.css">
</head>

<body>

    <div class="login-container">

        <div class="login-box">
        
            <h1>Login</h1>

            <form id="form-login">

                <!-- USUÁRIO -->
                <div class="input-box">
                    <input type="text" id="usuario" placeholder="CPF ou E-mail" required>
                    <i class="fa-solid fa-user"></i>
                </div>

                <!-- SENHA -->
                <div class="input-box">
                    <input type="password" id="senha" placeholder="Senha" required>
                    <!-- Adicionado id="toggleSenha" e cursor pointer para indicar que é clicável -->
                    <i class="fa-solid fa-lock" id="toggleSenha" style="cursor: pointer;" title="Mostrar/Ocultar senha"></i>
                </div>

                <!-- OPÇÕES -->
                <div class="login-options">

                    <label>
                        <input type="checkbox" id="lembrar">
                        Lembrar de mim
                    </label>

                    <a href="esquecisenha.html">Esqueceu a senha?</a>

                </div>
                <!-- Checkbox para ativar o modo Admin -->
                <div class="admin-checkbox-container" style="margin: 10px 0; display: flex; align-items: center; gap: 8px;">
                    <input type="checkbox" id="checkSouAdm" onchange="toggleAdminInput()">
                    <label for="checkSouAdm" style="color: #ccc; font-size: 14px; cursor: pointer;">Sou Adm</label>
                </div>
                
                <!-- Campo oculto que aparece ao marcar o checkbox -->
                <div id="adminPinContainer" style="display: none; margin-bottom: 10px;">
                    <input type="password" id="adminPin" placeholder="Digite o PIN de acesso" maxlength="4"
                        style="width: 100%; padding: 8px; background: rgba(255,255,255,0.1); border: 1px solid #444; color: #fff; border-radius: 4px; text-align: center; letter-spacing: 3px;">
                </div>
                <!-- BOTÃO -->
                <button type="submit" class="login-button">
                    Login
                </button>

            </form>

            <!-- CADASTRO -->
            <p class="register">
                Não tem uma conta?
                <a href="cadastro.html">Cadastre-se</a>
            </p>

        </div>

    </div>

    <!-- SCRIPT DO PÓDIO / MOSTRAR SENHA -->
    <script>
        const toggleSenha = document.getElementById('toggleSenha');
        const inputSenha = document.getElementById('senha');

        if (toggleSenha && inputSenha) {
            toggleSenha.addEventListener('click', function () {
                if (inputSenha.type === 'password') {
                    inputSenha.type = 'text';
                    toggleSenha.classList.remove('fa-lock');
                    toggleSenha.classList.add('fa-unlock'); // Altera para o cadeado aberto
                } else {
                    inputSenha.type = 'password';
                    toggleSenha.classList.remove('fa-unlock');
                    toggleSenha.classList.add('fa-lock'); // Retorna para o cadeado fechado
                }
            });
        }
    </script>

    <!-- SCRIPT DE LOGIN -->
    <script src="login.js"></script>

</body>
</html>
