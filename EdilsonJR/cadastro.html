<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <!-- Faz o site se adaptar ao celular -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Font Awesome - Ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet" href="cadastro.css">

    <title>Cadastro - Torneio de Sinuca dos Amigos</title>
</head>

<body>

    <div class="cadastro-container">

        <div class="cadastro-box">

            <h1>Cadastro</h1>

            <form action="login.html" method="GET" style="width: 100%;">

                <!-- NOME COMPLETO -->
                <div class="form-group">
                    <label for="username">Nome Completo:</label>
                    <input type="text" id="username" name="username" placeholder="Seu nome completo" required>
                </div>
                
                <!-- COMO QUER SER CHAMADO -->
                <div class="form-group">
                    <label for="nickname">Como quer ser chamado:</label>
                    <input type="text" id="nickname" name="nickname" placeholder="Seu nome ou apelido" required>
                </div>
                
                <!-- CPF -->
                <div class="form-group">
                    <label for="cpf">CPF:</label>
                    <input type="text" id="cpf" name="cpf" placeholder="Digite seu CPF" maxlength="14" inputmode="numeric" required>
                </div>
                
                <!-- E-MAIL -->
                <div class="form-group">
                    <label for="email">E-mail:</label>
                    <input type="email" id="email" name="email" placeholder="Seu e-mail" required>
                </div>

                <!-- SENHA -->
                <div class="form-group">
                    <label for="password">Senha:</label>
                    <div class="password-box">
                        <input type="password" id="password" name="password" placeholder="Digite sua senha" required>
                        <button type="button" class="toggle-password" id="toggle-password">
                            <i class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                </div>

                <!-- CONFIRMAR SENHA -->
                <div class="form-group">
                    <label for="confirm-password">Confirme a Senha:</label>
                    <div class="password-box">
                        <input type="password" id="confirm-password" name="confirm-password" placeholder="Confirme sua senha" required>
                        <button type="button" class="toggle-password" id="toggle-confirm-password">
                            <i class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                </div>

                <!-- FORMA DE PAGAMENTO -->
                <div class="form-group" style="margin-bottom: 20px;">
                    <label for="forma-pagamento" style="display: block; margin-bottom: 8px; font-weight: bold;">Forma de Pagamento:</label>
                    <select id="forma-pagamento" name="forma_pagamento" class="form-control" onchange="mostrarInstrucoesPagamento()" required style="width: 100%; padding: 10px; border-radius: 8px; background: rgba(255,255,255,0.1); color: white; border: 1px solid rgba(255,255,255,0.3);">
                        <option value="" style="color: black;">Selecione a forma de pagamento...</option>
                        <option value="pix" style="color: black;">Pix</option>
                        <option value="dinheiro" style="color: black;">Dinheiro</option>
                    </select>
                </div>

                <!-- ÁREA DINÂMICA DE INSTRUÇÕES DE PAGAMENTO -->
                <div id="instrucoes-pagamento" style="margin-bottom: 20px;"></div>

                <!-- BOTÃO -->
                <button type="submit" class="register-button">Cadastrar</button>

                <div class="login-link">
                    Já possui uma conta? <a href="login.html">Entrar</a>
                </div>

            </form>

        </div>
        
    </div>

    <!-- JAVASCRIPT LOCAL PARA O PAGAMENTO -->
    <script>
        // Chave Pix fixa da administração (substitua pela sua chave real caso precise)
        const CHAVE_PIX_FIXA = "c266aaf7-bb22-4c55-adf9-7735117b509d"; 

        function mostrarInstrucoesPagamento() {
            const select = document.getElementById("forma-pagamento");
            const container = document.getElementById("instrucoes-pagamento");
            
            if (select.value === "dinheiro") {
                container.innerHTML = `
                    <div style="background: rgba(255, 193, 7, 0.2); border: 1px solid #ffc107; padding: 15px; border-radius: 8px; color: #fff;">
                        <strong>💵 Pagamento em Dinheiro:</strong><br>
                        Por favor, dirija-se até a administração para efetuar o pagamento e validar a sua inscrição.
                    </div>
                `;
            } else if (select.value === "pix") {
                container.innerHTML = `
                    <div style="background: rgba(0, 191, 99, 0.2); border: 1px solid #00bf63; padding: 15px; border-radius: 8px; color: #fff;">
                        <strong>📱 Pagamento via Pix:</strong><br>
                        Copie a chave Pix abaixo para realizar a transferência:<br>
                        <div style="display: flex; gap: 10px; margin-top: 8px; align-items: center;">
                            <input type="text" id="input-chave-pix" value="${CHAVE_PIX_FIXA}" readonly style="width: 100%; padding: 8px; border-radius: 5px; border: none; background: rgba(0,0,0,0.5); color: #fff;">
                            <button type="button" onclick="copiarChavePix()" style="padding: 8px 12px; background: #00bf63; border: none; color: white; border-radius: 5px; cursor: pointer; font-weight: bold;">Copiar</button>
                        </div>
                        <p style="margin-top: 10px; font-size: 13px; color: #ddd;">
                            Assim que efetuar o pagamento, informe a administração com o comprovante em mãos para liberar seu acesso.
                        </p>
                    </div>
                `;
            } else {
                container.innerHTML = "";
            }
        }

        function copiarChavePix() {
            const inputPix = document.getElementById("input-chave-pix");
            inputPix.select();
            inputPix.setSelectionRange(0, 99999);
            navigator.clipboard.writeText(inputPix.value);
            alert("Chave Pix copiada com sucesso!");
        }
    </script>

    <!-- JAVASCRIPT PRINCIPAL -->
    <script src="cadastro.js"></script>

</body>

</html>
